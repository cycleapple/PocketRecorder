name: Release API 13 zh-TW
on:
  push:
    tags: ['api13-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: python scripts/Verify-Locales.py
      - run: dotnet build PocketRecorder.csproj -c Release -p:Platform=x64
      - shell: pwsh
        run: ./scripts/Package-Api13.ps1
      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" artifacts/* --prerelease --title "Pocket Recorder $env:GITHUB_REF_NAME（繁體中文測試版）" --notes-file RELEASE-NOTES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
