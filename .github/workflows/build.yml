name: Build API 13 zh-TW
on:
  push:
    branches: [api13-zh-tw]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: python scripts/Verify-Locales.py
      - run: dotnet build PocketRecorder.csproj -c Release -p:Platform=x64
      - shell: pwsh
        run: ./scripts/Package-Api13.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PocketRecorder-API13-zh-TW
          path: artifacts/*
          retention-days: 30
