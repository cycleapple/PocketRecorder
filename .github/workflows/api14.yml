name: Verify API14 managed and native build
on:
  push:
    branches: [api14-tw]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - uses: microsoft/setup-msbuild@v2
      - name: Download pinned API14 references
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'dalamud-api14.zip'
          Invoke-WebRequest https://raw.githubusercontent.com/goatcorp/dalamud-distrib/6fb2b12018922bddeef009edd26082f068f8c602/latest.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '6A9F9AEE19AF4280F2D61680BBFF960AE48E5DCAAD70707BAAD857DA2F9D8E48') { throw 'Reference archive hash mismatch' }
          $refs = Join-Path $env:RUNNER_TEMP 'dalamud-api14'
          Expand-Archive $zip $refs
          "DALAMUD_HOME=$refs" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python scripts/Verify-Locales.py
      - run: dotnet run --project tests/CaptureRetirement.Tests -c Release
      - name: Build managed plugin and native recorder
        shell: pwsh
        run: |
          dotnet build PocketRecorder.csproj -c Release -p:Platform=x64 "-p:DalamudLibPath=$env:DALAMUD_HOME/"
          if ($LASTEXITCODE -ne 0) { throw 'API14/native build failed' }
      - name: Verify API14 package
        shell: pwsh
        run: ./scripts/Package-Api14.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PocketRecorder-API14-build-verification
          path: artifacts/*
          retention-days: 7
